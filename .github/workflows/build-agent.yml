name: Build Operator Agent

# Builda o .exe do Agent "Metas - Desenhistas" num runner Windows limpo do GitHub.
# Necessário porque o ESET na máquina local trava o app.asar e impede o
# electron-builder de gerar o instalador (ver CLAUDE.md §12 G-009).
#
# Saída: 2 artefatos no `release/` (configurado em apps/operator-agent/electron-builder.yml):
# - `Metas-Desenhistas-<version>-x64-portable.exe` (portable, sem instalação)
# - `Metas-Desenhistas-Setup-<version>.exe` (instalador NSIS pt-BR, com Start Menu shortcut)
#
# **Importante:** o Agent é tray-resident (ADR-011), tem auto-start (HKCU Run) e um
# wizard de first-run (BL-C5-003/006, ADR-028). Após instalar, o Agent abre o wizard
# quando não há config: o operador informa user_id + pasta compartilhada e o
# `config.json` é gravado em `C:\ProgramData\Metas - Desenhistas\` automaticamente.
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'apps/operator-agent/**'
      - 'packages/contracts/**'
      - 'packages/fs-adapter/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-agent.yml'

concurrency:
  group: build-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build de develop NÃO assina (assinatura só no release.yml). Garante que o
  # electron-builder não tente assinar pelo store agora que o electron-builder.yml
  # tem config de signing (BL-C0-008).
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Build Sprint Operator Agent (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O Agent consome @sprint/ui-kit via dist/ (Vite library mode). O `make`
      # abaixo roda `pnpm --filter sprint-operator-agent ...` direto (sem o
      # `^build` do Turbo), então o dist/ do ui-kit precisa ser gerado antes —
      # senão `tsc --noEmit` falha com TS2307 (Cannot find module '@sprint/ui-kit').
      - name: Build @sprint/ui-kit (dist consumido pelo Agent)
        run: pnpm --filter @sprint/ui-kit build

      - name: Build Agent (portable .exe + instalador NSIS)
        run: pnpm --filter sprint-operator-agent run make

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sprint-operator-agent-windows
          path: apps/operator-agent/release/*.exe
          if-no-files-found: error
          retention-days: 14
